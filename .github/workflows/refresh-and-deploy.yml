name: Refresh data and deploy

on:
  schedule:
    - cron: "47 3 * * 2-6"   # 10:47 Asia/Bangkok, Tue-Sat (after US closes)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild dataset
        run: python3 -I scripts/refresh.py "$RUNNER_TEMP/work"
      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r "$RUNNER_TEMP/work/out/." site/
          mkdir -p site/build && cp scripts/refresh.py site/build/refresh.py.txt
          ls -la site | head
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
